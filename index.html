<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Temperature Map Visualization</title>
        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="header">
            <a
                href="https://www.egr.msu.edu/~ptan/dminer/"
                target="_blank"
                class="logo"
            >
                <h1 class="lab">DMiner Lab</h1>
                <h2 class="msu">@ MSU</h2>
            </a>
            <h1 class="title">
                <a
                    href="http://www.cse.msu.edu/~ptan/project/xtreme/"
                    target="_blank"
                >
                    Prediction and Characterization of Extreme Events in
                    Spatio-Temporal Data
                </a>
            </h1>
        </header>

        <div class="menubar">
            <a
                class="about-link"
                href="http://www.cse.msu.edu/~ptan/project/xtreme/"
                target="_blank"
                ><div class="link-container">Home</div></a
            >
            <button id="openSettings">Visualization Settings</button>
            <a
                class="about-link"
                href="http://www.cse.msu.edu/~ptan/project/xtreme/"
                target="_blank"
            >
                <div class="link-container">About</div>
            </a>
        </div>

        <div class="container">
            <div id="map"></div>
            <div class="graphs">
                <div id="timeseries">
                    <a href="#" id="downloadLink"></a>
                </div>
                <div id="histogram"></div>
                <!-- New div for the histogram -->
            </div>
        </div>

        <!-- Modal structure -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Adjust Visualization Settings</h2>
                <div class="modal-inputs">
                    <div class="param">
                        <label for="model"><b>Model</b></label>
                        <select id="modelSelect" name="model">
                            <option value="gcm">GCM (CESM2 SSP585)</option>
                            <option value="dl">Deep Extrema</option>
                        </select>
                    </div>
                    <div class="param">
                        <label for="variable"><b>Variable</b></label>
                        <select id="variableSelect" name="variable">
                            <option value="ta">Temperature</option>
                            <option value="prec" disabled>Precipitation</option>
                        </select>
                    </div>
                    <div class="param">
                        <label for="statistics"
                            ><b>Statistics to plot</b></label
                        >
                        <select id="statisticsSelect" name="statistics">
                            <option value="regression_coefficient">
                                Trend Coefficient
                            </option>
                            <option value="mean">Mean</option>
                            <option value="scale">Scale</option>
                            <option value="shape">Shape</option>
                        </select>
                    </div>
                </div>
                <button id="applySettingsBtn" onclick="updateParameters()">
                    Apply Settings
                </button>
            </div>
        </div>
        <script src="./main.js"></script>
    </body>
</html>
